spring:
  application:
    name: extratos-aplicacoes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/extratos}
    username: ${DB_USER:extratos}
    password: ${DB_PASSWORD:extratos}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # limites de upload; o controller também valida por arquivo (§7)
      max-file-size: ${UPLOAD_MAX_FILE_MB:20}MB
      max-request-size: ${UPLOAD_MAX_REQUEST_MB:100}MB

# Integração Claude (§6/§11) — chave só no servidor
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:4096}
  timeout-ms: ${ANTHROPIC_TIMEOUT_MS:180000}
  max-tentativas: ${ANTHROPIC_MAX_TENTATIVAS:3}
  backoff-ms: ${ANTHROPIC_BACKOFF_MS:5000}
  versao: ${ANTHROPIC_VERSION:2023-06-01}

# Storage (§11)
storage:
  type: ${STORAGE_TYPE:fs}
  base-path: ${STORAGE_BASE_PATH:data/arquivos}
  bucket: ${STORAGE_BUCKET:extratos}
  endpoint: ${STORAGE_ENDPOINT:}
  region: ${STORAGE_REGION:us-east-1}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  path-style: ${STORAGE_PATH_STYLE:true}

# Upload (§7)
upload:
  max-file-mb: ${UPLOAD_MAX_FILE_MB:20}

# Extração (§5)
extracao:
  throttle-ms: ${EXTRACAO_THROTTLE_MS:0}
  zona: ${EXTRACAO_ZONA:America/Sao_Paulo}

# Ingestão por e-mail (§13) — Gmail via OAuth2; credenciais só no servidor
email:
  enabled: ${EMAIL_ENABLED:false}
  provider: ${EMAIL_PROVIDER:gmail}
  client-id: ${EMAIL_CLIENT_ID:}
  client-secret: ${EMAIL_CLIENT_SECRET:}
  redirect-uri: ${EMAIL_REDIRECT_URI:http://localhost:8080/api/email/oauth/callback}
  scope: ${EMAIL_SCOPE:https://www.googleapis.com/auth/gmail.readonly}
  subject-keywords: ${EMAIL_SUBJECT_KEYWORDS:extrato,aplicação,aplicacao,posição,posicao,investimento,rendimento}
  lookback-days: ${EMAIL_LOOKBACK_DAYS:30}
  poll-interval-ms: ${EMAIL_POLL_INTERVAL_MS:300000}
  query: ${EMAIL_QUERY:}
  max-por-ciclo: ${EMAIL_MAX_POR_CICLO:50}
  timeout-ms: ${EMAIL_TIMEOUT_MS:20000}

# CORS (§7) — origem do frontend em dev
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.mendoncagalvao.extratos: INFO
