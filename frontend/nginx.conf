server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Permite que o CRM abra este sistema dentro de um iframe (módulo Contábil).
    # Usa CSP frame-ancestors (substitui o antigo X-Frame-Options) liberando os
    # domínios internos da Mendonça Galvão / Núcleo Digital.
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.mendoncagalvao.com.br https://*.nucleodigital.cloud" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA: rotas do React Router caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxied para o backend (mesma origem → sem CORS no navegador)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 110m;
    }
}
